name: wayfarer_ai
description: "Intelligent Cross-Platform Trip Planner & Itinerary Architect"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Google Maps & Location (commented out - no API key available)
  # google_maps_flutter: ^2.5.3
  # geolocator: ^11.0.0
  # geocoding: ^2.1.1

  # HTTP & API
  dio: ^5.4.0
  # retrofit: ^4.0.3
  json_annotation: ^4.8.1
  google_generative_ai: ^0.2.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2
  universal_html: ^2.2.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  logger: ^2.0.2+1
  url_launcher: ^6.2.4

  # Weather API (commented out - no API key available)
  # weather: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  # retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - icons/
